# Enhancement completion/archive — install in the TARGET repository.
#
# After a PR that resolves an `arena-handover` issue merges into main, archive
# the handover: move future-enhancements/<name>.md into archived/, flip its
# status to "Archived", and close the linked request. The Enhancements Hub's
# `POST /api/v1/sync` (or `npm run sync`) then reconciles the hub database.

name: Complete enhancement handovers

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to process (backfill)"
        required: true

permissions:
  contents: write
  pull-requests: read
  issues: write

concurrency:
  group: enhancement-archive
  cancel-in-progress: false

jobs:
  archive:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      HANDOVER_DIR: ${{ vars.HANDOVER_DIR || 'future-enhancements' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve handovers from the merged PR
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          names=$(gh pr view "$PR_NUMBER" --json body,closingIssuesReferences --jq '.body' \
            | grep -oE 'Enhancement-Archive: [^[:space:]]+\.md' | awk '{print $2}' | sort -u || true)
          # Fallback: any handover referenced by a closed, labelled arena-handover issue.
          if [ -z "$names" ]; then
            for issue in $(gh pr view "$PR_NUMBER" --json closingIssuesReferences --jq '.closingIssuesReferences[].number' 2>/dev/null || true); do
              if gh issue view "$issue" --json labels --jq '.labels[].name' | grep -qx arena-handover; then
                names="$names $(gh issue view "$issue" --json body --jq '.body' \
                  | grep -oE 'Enhancement-Archive: [^[:space:]]+\.md' | awk '{print $2}' | sort -u || true)"
              fi
            done
          fi
          {
            echo "names<<EOF"
            echo $names | tr ' ' '\n' | grep -E '^ENH-[0-9]+-[a-z0-9-]+\.md$' | sort -u
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Archive resolved handovers
        id: archive
        if: steps.resolve.outputs.names != ''
        env:
          ARCHIVE_NAMES_FILE: .tmp/archive-names.txt
          ARCHIVED_NAMES_FILE: .tmp/archived-names.txt
        run: |
          mkdir -p .tmp
          printf '%s\n' "${{ steps.resolve.outputs.names }}" > .tmp/archive-names.txt
          node scripts/enhancement-archive.mjs --dir "$HANDOVER_DIR"

      - name: Commit archive
        if: steps.archive.outcome == 'success' && steps.resolve.outputs.names != ''
        env:
          NAMES: ${{ steps.resolve.outputs.names }}
        run: |
          git config user.name "enhancements-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A "$HANDOVER_DIR"
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "docs(enhancements): archive completed handovers

          $(echo "$NAMES" | sed 's/^/Enhancement-Archive: /')"
          git push

      - name: Close linked requests
        if: steps.archive.outcome == 'success'
        uses: actions/github-script@v7
        env:
          NAMES: ${{ steps.resolve.outputs.names }}
        with:
          script: |
            const names = process.env.NAMES.split("\n").map(s => s.trim()).filter(Boolean);
            for (const name of names) {
              const marker = `Enhancement-Archive: ${name}`;
              const found = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open label:arena-handover in:body "${marker}"`,
                per_page: 5,
              });
              for (const issue of found.data.items) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                  body: `Handover \`${name}\` archived by PR #${{ inputs.pr_number || github.event.pull_request.number }}. Closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: "closed",
                });
              }
            }
