<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enhancements Hub</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --border: #2d333b;
      --text: #e6edf3; --muted: #8b949e; --accent: #4f8ff7; --accent2: #7ee2b8;
      --warn: #e3b341; --bad: #f85149; --good: #3fb950;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { display: flex; align-items: center; gap: 14px; padding: 14px 22px; border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 5; }
    header h1 { font-size: 16px; margin: 0; font-weight: 650; }
    header .sub { color: var(--muted); font-size: 12px; }
    header .spacer { flex: 1; }
    header input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; width: 220px; }
    nav { display: flex; gap: 4px; padding: 10px 22px 0; border-bottom: 1px solid var(--border); background: var(--panel); }
    nav button { background: none; border: none; color: var(--muted); padding: 8px 14px; cursor: pointer; font: inherit; border-bottom: 2px solid transparent; }
    nav button.active { color: var(--text); border-bottom-color: var(--accent); }
    main { padding: 20px 22px 60px; }
    .grid { display: grid; gap: 14px; }
    .cards { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
    .card h3 { margin: 0 0 6px; font-size: 14px; }
    .card .muted { color: var(--muted); font-size: 12px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 11px; border: 1px solid var(--border); color: var(--muted); }
    .pill.Submitted { color: #9ecbff; border-color: #9ecbff55; } .pill.Reviewing { color: var(--warn); border-color: #e3b34155; }
    .pill.Accepted { color: var(--accent2); border-color: #7ee2b855; } .pill.Building { color: var(--accent); border-color: #4f8ff755; }
    .pill.Built { color: #d2a8ff; border-color: #d2a8ff55; } .pill.Archived { color: var(--muted); } .pill.Rejected { color: var(--bad); border-color: #f8514955; }
    button.act { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 11px; cursor: pointer; font: inherit; font-size: 12px; }
    button.act:hover { border-color: var(--accent); }
    button.act.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.act.danger:hover { border-color: var(--bad); color: var(--bad); }
    select, textarea, input[type=text], input[type=number] { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; font: inherit; width: 100%; }
    textarea { min-height: 64px; resize: vertical; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 10px; border-bottom: 1px solid var(--border); }
    td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    code, pre { background: var(--bg); border-radius: 6px; font: 12px ui-monospace, monospace; }
    pre { padding: 10px; overflow: auto; border: 1px solid var(--border); max-height: 420px; }
    .board { display: grid; grid-template-columns: repeat(6, minmax(200px, 1fr)); gap: 12px; overflow-x: auto; }
    .col { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px; min-height: 120px; }
    .col h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .ticket { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; margin-bottom: 8px; cursor: pointer; }
    .ticket:hover { border-color: var(--accent); }
    .ticket .ref { color: var(--accent); font-size: 11px; font-family: ui-monospace, monospace; }
    .ticket .title { font-size: 13px; margin: 2px 0; }
    .ticket .meta { color: var(--muted); font-size: 11px; }
    .split { display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; align-items: start; }
    @media (max-width: 980px) { .split, .board { grid-template-columns: 1fr; } }
    .toast { position: fixed; bottom: 18px; right: 18px; background: var(--panel2); border: 1px solid var(--accent); border-radius: 8px; padding: 10px 16px; max-width: 420px; display: none; z-index: 20; }
    .toast.err { border-color: var(--bad); }
    .hint { color: var(--muted); font-size: 12px; }
    .statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
    .stat b { font-size: 22px; display: block; }
    .stat span { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>⚙ Enhancements Hub</h1>
    <span class="sub">central · multi-tenant · MCP-ready</span>
    <div class="spacer"></div>
    <input id="apikey" type="text" placeholder="API key (optional)" title="Sent as X-Api-Key. Stored locally in your browser only." />
  </header>
  <nav id="tabs">
    <button data-tab="pipeline" class="active">Pipeline</button>
    <button data-tab="studio">Studio</button>
    <button data-tab="registry">Registry</button>
    <button data-tab="vault">Vault</button>
    <button data-tab="audit">Audit</button>
  </nav>
  <main>
    <section id="view-pipeline"></section>
    <section id="view-studio" hidden></section>
    <section id="view-registry" hidden></section>
    <section id="view-vault" hidden></section>
    <section id="view-audit" hidden></section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
