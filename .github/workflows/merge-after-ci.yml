name: Merge passing enhancement PR

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: merge-after-ci-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.name == 'CI'
    runs-on: ubuntu-latest
    steps:
      # workflow_run executes from the default branch; checkout the same trusted
      # default branch, never the untrusted PR head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify title, head SHA and required check, then squash-merge
        id: merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTO_MERGE_ENABLED: ${{ vars.AUTO_MERGE_ENABLED }}
          REQUIRED_CHECK_NAME: ${{ vars.REQUIRED_CHECK_NAME }}
        run: node scripts/merge-passing-pr.mjs
